[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200

; Link library objects directly so the port's TIM3_IRQHandler
; overrides the weak default handler
lib_archive = no

build_flags =
    -I include
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM3


; ============================================================
; Part XIV - Native unit-test environment
; ============================================================

[env:native]
platform = native
test_framework = unity
test_build_src = yes

build_src_filter =
    -<*>
    +<alarm.cpp>
    +<system_state.cpp>
    +<display_logic.cpp>

build_flags =
    -I include